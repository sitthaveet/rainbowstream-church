# Rainbow Stream Church — write operations.
#
# All operations are level: PUBLIC: the Next.js API route handlers proxy every
# database call and enforce the authorization rules in AGENTS.md. The
# `insecureReason` records that acknowledgement so deploys are not blocked.

# ─── Users ──────────────────────────────────────────────────────────────────

# Auto-create an account on first LINE login. Only line_id is known here;
# the rest of the profile is filled in later via the registration form.
mutation CreateUser($lineId: String!)
  @auth(level: PUBLIC, insecureReason: "Authorization enforced by Next.js route handlers (AGENTS.md).") {
  user_insert(data: { lineId: $lineId })
}

# Complete or edit a profile via the registration form.
mutation UpdateUserProfile(
  $id: UUID!
  $firstName: String
  $lastName: String
  $nickname: String
  $birthdate: Date
  $email: String
  $phoneNumber: String
  $address: String
  $sexAtBirth: SexAtBirth
  $identityOrientation: IdentityOrientation
  $identityOrientationOther: String
  $christianDuration: Int
  $church: String
  $selfIntroduction: String
) @auth(level: PUBLIC, insecureReason: "Authorization enforced by Next.js route handlers (AGENTS.md).") {
  user_update(
    id: $id
    data: {
      firstName: $firstName
      lastName: $lastName
      nickname: $nickname
      birthdate: $birthdate
      email: $email
      phoneNumber: $phoneNumber
      address: $address
      sexAtBirth: $sexAtBirth
      identityOrientation: $identityOrientation
      identityOrientationOther: $identityOrientationOther
      christianDuration: $christianDuration
      church: $church
      selfIntroduction: $selfIntroduction
      updatedAt_expr: "request.time"
    }
  )
}

# Promote/demote a member (pastor only — enforced in the route handler).
mutation UpdateUserRole($id: UUID!, $role: UserRole!)
  @auth(level: PUBLIC, insecureReason: "Authorization enforced by Next.js route handlers (AGENTS.md).") {
  user_update(id: $id, data: { role: $role, updatedAt_expr: "request.time" })
}

# Remove a member (pastor only — enforced in the route handler).
mutation DeleteUser($id: UUID!)
  @auth(level: PUBLIC, insecureReason: "Authorization enforced by Next.js route handlers (AGENTS.md).") {
  user_delete(id: $id)
}

# ─── Events ─────────────────────────────────────────────────────────────────

# Create an event (pastor only — enforced in the route handler).
# checkin_code is generated by the column default.
mutation CreateEvent(
  $title: String!
  $description: String
  $location: String
  $startsAt: Timestamp!
  $endsAt: Timestamp
  $createdById: UUID!
) @auth(level: PUBLIC, insecureReason: "Authorization enforced by Next.js route handlers (AGENTS.md).") {
  event_insert(
    data: {
      title: $title
      description: $description
      location: $location
      startsAt: $startsAt
      endsAt: $endsAt
      createdById: $createdById
    }
  )
}

# Edit an event (pastor only — enforced in the route handler).
mutation UpdateEvent(
  $id: UUID!
  $title: String!
  $description: String
  $location: String
  $startsAt: Timestamp!
  $endsAt: Timestamp
) @auth(level: PUBLIC, insecureReason: "Authorization enforced by Next.js route handlers (AGENTS.md).") {
  event_update(
    id: $id
    data: {
      title: $title
      description: $description
      location: $location
      startsAt: $startsAt
      endsAt: $endsAt
      updatedAt_expr: "request.time"
    }
  )
}

# Delete an event (pastor only). checkins cascade-delete with the event.
mutation DeleteEvent($id: UUID!)
  @auth(level: PUBLIC, insecureReason: "Authorization enforced by Next.js route handlers (AGENTS.md).") {
  event_delete(id: $id)
}

# ─── Check-ins ──────────────────────────────────────────────────────────────

# Check a member into an event and award 10 points, atomically. The
# UNIQUE (event_id, user_id) constraint rejects a duplicate check-in, and
# @transaction then rolls back the point award.
mutation CheckIn($eventId: UUID!, $userId: UUID!) @transaction
  @auth(level: PUBLIC, insecureReason: "Authorization enforced by Next.js route handlers (AGENTS.md).") {
  checkin_insert(data: { eventId: $eventId, userId: $userId })
  user_update(
    id: $userId
    data: { points_update: { inc: 10 }, updatedAt_expr: "request.time" }
  )
}
